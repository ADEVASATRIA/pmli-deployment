# Nginx server block for the PMLI LMS Laravel API.
# Installed by scripts/03-deploy-app.sh to /etc/nginx/sites-available/.
#
# ONE server block serves BOTH:
#   - plain HTTP on :80  — used for the PRIVATE frontend->API path
#     (Frontend Nginx proxies http://192.168.50.50/... here). This listener
#     does NOT redirect to HTTPS: redirecting a private-IP request to
#     https://192.168.50.50/... would fail TLS validation, because the
#     certificate below is issued for api-lms.pmli.co.id, not the IP.
#   - TLS on :443        — the public https://api-lms.pmli.co.id endpoint.
#
# A single block with two `listen` directives (one plain, one `ssl`) is the
# standard Nginx way to serve byte-for-byte identical routing on both — the
# `ssl_*` directives are simply ignored on the plain :80 listener. This
# avoids duplicating the location/fastcgi rules in two server blocks.
#
# server_name lists BOTH the public domain and the private IP so a request
# arriving with either as its Host header matches THIS block, never Nginx's
# default/first-server-block fallback. `default_server` on every listener is
# the same guarantee belt-and-braces: after 03-deploy-app.sh removes the
# stock `sites-enabled/default` symlink, this is the only site installed, so
# it already becomes the implicit default — `default_server` just makes that
# explicit instead of relying on "nothing else is installed" as the reason.
#
# If APP_DIR, PHP_VERSION, TLS_CERT_PATH or TLS_KEY_PATH in env/api.env
# differ from the defaults below, 03-deploy-app.sh substitutes them when it
# installs this file. Do not hand-edit the installed copy on the server —
# change this file and redeploy.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name api-lms.pmli.co.id 192.168.50.50;

    ssl_certificate     /etc/ssl/pmli/fullchain.crt;
    ssl_certificate_key /etc/ssl/pmli/private.key;

    root /var/www/pmli-backend/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # TEMPORARY / REQUIRES APPLICATION TEAM CONFIRMATION: 20M is a placeholder, not an agreed limit.
    # Align with PHP upload_max_filesize / post_max_size once the application team confirms.
    client_max_body_size 20M;

    access_log /var/log/nginx/api-lms.pmli.co.id.access.log;
    error_log  /var/log/nginx/api-lms.pmli.co.id.error.log;

    # Security headers safe for a JSON API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the Laravel front controller is executed by PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    # Any other .php request (e.g. an uploaded file) is never executed.
    location ~ \.php$ {
        return 404;
    }

    # Allow ACME challenges; deny every other dotfile (.env, .git, ...).
    location ^~ /.well-known/ {
        allow all;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
