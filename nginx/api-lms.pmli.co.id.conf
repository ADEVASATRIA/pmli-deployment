# Nginx server block for the PMLI LMS Laravel API.
# Installed by scripts/03-deploy-app.sh to /etc/nginx/sites-available/.
#
# HTTP only for now: SSL is not provisioned yet, so there are deliberately NO
# certificate paths and NO 443 listener here. Add TLS (e.g. via Certbot) later
# and only then add HSTS.
#
# If APP_DIR or PHP_VERSION in env/api.env differ from the defaults below
# (/var/www/pmli-backend, 8.3), 03-deploy-app.sh substitutes them when it
# installs this file.

server {
    listen 80;
    listen [::]:80;
    server_name api-lms.pmli.co.id;

    root /var/www/pmli-backend/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # TEMPORARY / REQUIRES APPLICATION TEAM CONFIRMATION: 20M is a placeholder, not an agreed limit.
    # Align with PHP upload_max_filesize / post_max_size once the application team confirms.
    client_max_body_size 20M;

    access_log /var/log/nginx/api-lms.pmli.co.id.access.log;
    error_log  /var/log/nginx/api-lms.pmli.co.id.error.log;

    # Security headers safe for a JSON API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the Laravel front controller is executed by PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    # Any other .php request (e.g. an uploaded file) is never executed.
    location ~ \.php$ {
        return 404;
    }

    # Allow ACME challenges; deny every other dotfile (.env, .git, ...).
    location ^~ /.well-known/ {
        allow all;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
