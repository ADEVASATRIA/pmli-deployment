# Nginx server block for the PMLI LMS FRONTEND (lms.pmli.co.id).
# Installed by scripts/06-update-frontend-nginx.sh to /etc/nginx/sites-available/.
#
# Serves the frontend's own production build as a static SPA, and reverse-proxies
# /api/ to the Laravel API over the PRIVATE network (confirmed working: a direct
# POST to http://192.168.50.50/api/v1/auth/login already returns Laravel's own 422
# validation JSON) so the browser only ever talks to lms.pmli.co.id - it never sees
# the API's private IP, and the API side is not touched by this file or script.
#
# ASSUMPTION - CONFIRM BEFORE FIRST USE: TLS terminates at THIS Nginx, mirroring
# api-lms.pmli.co.id.conf's own one-block/two-listener pattern. This repo has no
# prior frontend config to inherit that fact from (see README.md / env/
# frontend.env.example). If this VM instead sits behind a load balancer or CDN that
# already terminates TLS, drop the :443 listener and ssl_* directives below and stop
# supplying FRONTEND_TLS_CERT_PATH/FRONTEND_TLS_KEY_PATH in env/frontend.env.
#
# ASSUMPTION - CONFIRM BEFORE FIRST USE: the production build is a client-side-routed
# SPA (try_files ... /index.html fallback below). If the real frontend serves
# something else, adjust the `location /` block accordingly.
#
# If FRONTEND_DIR, FRONTEND_TLS_CERT_PATH or FRONTEND_TLS_KEY_PATH in
# env/frontend.env differ from the placeholders below, scripts/06-update-frontend-
# nginx.sh substitutes them when it installs this file. Do not hand-edit the
# installed copy on the server - change this file and redeploy.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name lms.pmli.co.id;

    ssl_certificate     __FRONTEND_TLS_CERT_PATH__;
    ssl_certificate_key __FRONTEND_TLS_KEY_PATH__;

    root __FRONTEND_DIR__;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Course Video uploads (~500 MB) pass through this proxy to the API; keep in line with the
    # API VM (600m). A lower value here would reject uploads before they ever reach the API.
    client_max_body_size 600m;

    access_log /var/log/nginx/lms.pmli.co.id.access.log;
    error_log  /var/log/nginx/lms.pmli.co.id.error.log;

    # Security headers safe for a static SPA + API proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Laravel API over the PRIVATE network only - the browser never sees this
    # address. No trailing slash on proxy_pass's own URL (no path after the host):
    # Nginx then forwards the full matched URI unchanged, so a browser request for
    # /api/v1/auth/login reaches the upstream as /api/v1/auth/login, not stripped.
    location /api/ {
        # Large Course Video uploads may continue processing on the API while Laravel transfers
        # the completed request body to object storage; wait up to 300s for the API response.
        # Scoped to /api/ only; static/SPA locations keep Nginx defaults.
        proxy_read_timeout 300s;
        proxy_pass http://192.168.50.50;
        proxy_set_header Host api-lms.pmli.co.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static SPA build: serve the file if it exists, otherwise fall back to
    # index.html for client-side routing. Never executes PHP - this is a plain
    # static file server; the API's own PHP-FPM is untouched and unreachable here.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow ACME challenges; deny every other dotfile.
    location ^~ /.well-known/ {
        allow all;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
