; PHP-FPM upload limits for the PMLI LMS API (Course Video uploads).
; Installed by scripts/03-deploy-app.sh to /etc/php/<ver>/fpm/conf.d/99-pmli-uploads.ini
; (FPM only - the CLI php.ini is deliberately NOT touched).
;
; Business-level limit (~500 MB) is enforced by Laravel via COURSE_VIDEO_MAX_KB=512000.
; These are transport ceilings that must sit ABOVE it, with
;   post_max_size > upload_max_filesize,   and   Nginx client_max_body_size >= post_max_size
; (nginx/api-lms.pmli.co.id.conf and nginx/lms.pmli.co.id.conf are both 600m).
; memory_limit is intentionally NOT set here: PHP streams uploads to a temp file and does
; not hold them in memory.
upload_max_filesize = 512M
post_max_size = 600M
